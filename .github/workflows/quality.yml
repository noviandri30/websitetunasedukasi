name: Website multi-page quality checks
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate multi-page website
        run: python scripts/check_site.py
